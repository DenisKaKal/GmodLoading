<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Garry's Mod Loading Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide.active { opacity: 1; }
    </style>
</head>
<body>

    <div class="slide" id="slideA"></div>
    <div class="slide" id="slideB"></div>

    <audio id="music" autoplay loop preload="auto">
        <source src="https://deniskakal.github.io/GmodLoading/music.ogg" type="audio/ogg">
        <source src="https://deniskakal.github.io/GmodLoading/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        var base = 'https://deniskakal.github.io/GmodLoading/';
        var rawImages = [
            'bg1.jpg','bg2.jpg','bg3.jpg','bg4.jpg',
            'bg5.jpg','bg6.jpg','bg7.jpg','bg8.jpg',
            'bg9.jpg','bg10.jpg','bg11.jpg','bg12.jpg',
            'bg13.jpg','bg14.jpg'
        ].map(function(f) { return base + f; });

        function shuffle(arr) {
            var array = arr.slice();
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        rawImages.forEach(function(url) {
            var img = new Image();
            img.src = url;
        });

        var playlist = shuffle(rawImages);
        var idx = 0;

        var currentSlide = document.getElementById('slideA');
        var nextSlide = document.getElementById('slideB');

        currentSlide.style.backgroundImage = "url('" + playlist[0] + "')";
        currentSlide.classList.add('active');

        setInterval(function() {
            idx++;
            
            if (idx >= playlist.length) {
                var lastImg = playlist[playlist.length - 1];
                do {
                    playlist = shuffle(rawImages);
                } while (playlist[0] === lastImg);
                idx = 0;
            }

            nextSlide.style.backgroundImage = "url('" + playlist[idx] + "')";
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');

            var temp = currentSlide;
            currentSlide = nextSlide;
            nextSlide = temp;
        }, 8000);

        // Настройка и воспроизведение музыки
        var music = document.getElementById('music');
        music.volume = 0.4; // 40% громкости

        function playMusic() {
            music.play().catch(function(){});
        }
        playMusic();
        ['click', 'mousemove', 'keydown'].forEach(function(evt) {
            document.addEventListener(evt, playMusic, { once: true });
        });
    </script>

</body>
</html>

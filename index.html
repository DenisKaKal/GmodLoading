<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Garry's Mod Loading Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        .slide {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Убраны старые переходы с z-index.
               Добавлен простой transition на opacity для чистого затухания. */
            transition: opacity 1.5s ease-in-out;
        }
        /* Убрана позиция top: 0, чтобы не было сдвига. */
        .slide.active { opacity: 1; }
        .slide:not(.active) { opacity: 0; }

        /* Чтобы один слайд плавно проявлялся ПОВЕРХ другого,
           им нужны фиксированные z-index, чтобы не менять их в JS. */
        #slideA { z-index: 1; }
        #slideB { z-index: 2; }
    </style>
</head>
<body>

    <div class="slide" id="slideA"></div>
    <div class="slide" id="slideB"></div>

    <audio id="music" autoplay loop preload="auto">
        <source src="https://deniskakal.github.io/GmodLoading/music.ogg" type="audio/ogg">
        <source src="https://deniskakal.github.io/GmodLoading/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        var base = 'https://deniskakal.github.io/GmodLoading/';
        var images = [
            'bg1.jpg','bg2.jpg','bg3.jpg','bg4.jpg',
            'bg5.jpg','bg6.jpg','bg7.jpg','bg8.jpg',
            'bg9.jpg','bg10.jpg','bg11.jpg','bg12.jpg',
            'bg13.jpg','bg14.jpg'
        ].map(function(f) { return base + f; });

        var idx = 0;
        var A = document.getElementById('slideA');
        var B = document.getElementById('slideB');
        
        A.style.backgroundImage = "url('" + images[0] + "')";
        A.classList.add('active');

        // Логика простого кроссфейда без z-index сдвига
        setInterval(function() {
            idx = (idx + 1) % images.length;
            
            if (A.classList.contains('active')) {
                // Если активен A, готовим B
                B.style.backgroundImage = "url('" + images[idx] + "')";
                // Т.к. у B z-index выше (2), он плавно проявится поверх A (1)
                B.classList.add('active');
                A.classList.remove('active');
            } else {
                // Если активен B, готовим A
                A.style.backgroundImage = "url('" + images[idx] + "')";
                // У А z-index ниже, поэтому он затухает, пока В активен,
                // а потом когда мы его делаем активным, он проявляется, когда В затухает.
                A.classList.add('active');
                B.classList.remove('active');
            }
            
        }, 8000);

        // Музыка
        var music = document.getElementById('music');
        function play() { music.play().catch(function(){}); }
        play();
        document.addEventListener('mousemove', play, { once: true });
        document.addEventListener('click', play, { once: true });
        document.addEventListener('keydown', play, { once: true });
    </script>

</body>
</html>

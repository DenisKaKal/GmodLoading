<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Garry's Mod Loading Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .gta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            filter: brightness(0.7);
        }
    </style>
</head>
<body>

    <!-- Фоновый блок -->
    <div class="gta-bg" id="gtaBg"></div>

    <!-- Музыка -->
    <audio autoplay loop src="music.mp3"></audio>

    <script>
        // Массив из всех 14 картинок
        var images = [
            'bg1.jpg', 'bg2.jpg', 'bg3.jpg', 'bg4.jpg', 
            'bg5.jpg', 'bg6.jpg', 'bg7.jpg', 'bg8.jpg', 
            'bg9.jpg', 'bg10.jpg', 'bg11.jpg', 'bg12.jpg', 
            'bg13.jpg', 'bg14.jpg'
        ];
        
        var currentIndex = 0;
        var bgElement = document.getElementById('gtaBg');

        // Устанавливаем первую картинку МГНОВЕННО при загрузке
        bgElement.style.backgroundImage = "url('" + images[0] + "')";

        // Переключение на следующую картинку каждые 8 секунд (8000 мс)
        setInterval(function() {
            currentIndex = (currentIndex + 1) % images.length;
            bgElement.style.backgroundImage = "url('" + images[currentIndex] + "')";
        }, 8000);
    </script>

</body>
</html>

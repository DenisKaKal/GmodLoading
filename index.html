<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Garry's Mod Loading Screen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        .slide {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide.active { opacity: 1; }
    </style>
</head>
<body>

    <div class="slide" id="slideA"></div>
    <div class="slide" id="slideB"></div>

    <audio id="music" autoplay loop preload="auto">
        <source src="music.ogg" type="audio/ogg">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Абсолютные URL — GMod не теряет путь к файлам
        var base = 'https://deniskakal.github.io/GmodLoading/';
        var images = [
            'bg1.jpg','bg2.jpg','bg3.jpg','bg4.jpg',
            'bg5.jpg','bg6.jpg','bg7.jpg','bg8.jpg',
            'bg9.jpg','bg10.jpg','bg11.jpg','bg12.jpg',
            'bg13.jpg','bg14.jpg'
        ].map(function(f) { return base + f; });

        var idx = 0;
        var A = document.getElementById('slideA');
        var B = document.getElementById('slideB');
        var useA = true;

        A.style.backgroundImage = "url('" + images[0] + "')";
        A.classList.add('active');

        setInterval(function() {
            idx = (idx + 1) % images.length;
            if (useA) {
                B.style.backgroundImage = "url('" + images[idx] + "')";
                B.style.zIndex = 1; A.style.zIndex = 0;
                B.classList.add('active'); A.classList.remove('active');
            } else {
                A.style.backgroundImage = "url('" + images[idx] + "')";
                A.style.zIndex = 1; B.style.zIndex = 0;
                A.classList.add('active'); B.classList.remove('active');
            }
            useA = !useA;
        }, 8000);

        // Музыка
        var music = document.getElementById('music');
        function play() { music.play().catch(function(){}); }
        play();
        document.addEventListener('mousemove', play, { once: true });
        document.addEventListener('click', play, { once: true });
        document.addEventListener('keydown', play, { once: true });
    </script>

</body>
</html>

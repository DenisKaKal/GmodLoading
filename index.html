<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Garry's Mod Loading Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .slide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Два слоя для плавного кроссфейда -->
    <div class="slide" id="slideA"></div>
    <div class="slide" id="slideB"></div>

    <script>
        // ===== СЛАЙДШОУ =====
        var images = [
            'bg1.jpg',  'bg2.jpg',  'bg3.jpg',  'bg4.jpg',
            'bg5.jpg',  'bg6.jpg',  'bg7.jpg',  'bg8.jpg',
            'bg9.jpg',  'bg10.jpg', 'bg11.jpg', 'bg12.jpg',
            'bg13.jpg', 'bg14.jpg'
        ];

        var currentIndex = 0;
        var slideA = document.getElementById('slideA');
        var slideB = document.getElementById('slideB');
        var useA = true;

        function setSlide(el, src) {
            el.style.backgroundImage = "url('" + src + "')";
        }

        setSlide(slideA, images[0]);
        slideA.classList.add('active');

        setInterval(function() {
            currentIndex = (currentIndex + 1) % images.length;
            if (useA) {
                setSlide(slideB, images[currentIndex]);
                slideB.style.zIndex = 1;
                slideA.style.zIndex = 0;
                slideB.classList.add('active');
                slideA.classList.remove('active');
            } else {
                setSlide(slideA, images[currentIndex]);
                slideA.style.zIndex = 1;
                slideB.style.zIndex = 0;
                slideA.classList.add('active');
                slideB.classList.remove('active');
            }
            useA = !useA;
        }, 8000);

        // ===== МУЗЫКА через AudioContext (обход блокировки) =====
        var audioCtx = null;
        var audioSource = null;
        var audioBuffer = null;
        var musicStarted = false;

        function startMusicAudioContext() {
            if (musicStarted) return;
            if (!audioBuffer) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioSource = audioCtx.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.loop = true;
                audioSource.connect(audioCtx.destination);
                audioSource.start(0);
                musicStarted = true;
            } catch(e) {}
        }

        function loadAndPlay() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Если контекст сразу в running — играем
                if (audioCtx.state === 'running' && audioBuffer) {
                    startMusicAudioContext();
                }

                // Слушаем разблокировку контекста
                audioCtx.onstatechange = function() {
                    if (audioCtx.state === 'running') startMusicAudioContext();
                };

                fetch('music.mp3')
                    .then(function(r) { return r.arrayBuffer(); })
                    .then(function(data) {
                        audioCtx.decodeAudioData(data, function(buffer) {
                            audioBuffer = buffer;
                            startMusicAudioContext();
                        });
                    })
                    .catch(function() {
                        // fetch не сработал — fallback на обычный audio
                        fallbackAudio();
                    });
            } catch(e) {
                fallbackAudio();
            }
        }

        // Fallback: обычный <audio> тег
        function fallbackAudio() {
            if (musicStarted) return;
            var audio = new Audio('music.mp3');
            audio.loop = true;
            audio.volume = 1;
            audio.play().then(function() {
                musicStarted = true;
            }).catch(function() {
                // Браузер всё равно блокирует — ждём взаимодействия
            });
        }

        // Запускаем сразу
        loadAndPlay();

        // При любом взаимодействии пробуем ещё раз
        ['click','keydown','mousemove','touchstart','mousedown'].forEach(function(evt) {
            document.addEventListener(evt, function() {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().then(function() {
                        startMusicAudioContext();
                    });
                }
                if (!musicStarted) fallbackAudio();
            }, { once: true });
        });
    </script>

</body>
</html>
